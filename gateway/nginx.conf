events {
    worker_connections 1024;
}

http {

    # ── 로그 포맷 ────────────────────────────────────────
    log_format main '$remote_addr - $request - $status - $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Rate Limiting 설정 ───────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;  
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ── CORS 허용 Origin 매핑 ────────────────────────
    # 프론트엔드 개발 서버 및 로컬 접속 허용
    map $http_origin $cors_origin {
        default "";
        "http://localhost:5173"  $http_origin;
        "http://localhost:3000"  $http_origin;
        "http://localhost"       $http_origin;
    }

    # ── 업스트림 (로드밸런싱 대상) ────────────────────────
    # 나중에 인스턴스 추가 시 server 줄만 추가하면 됨
    upstream user_service {
        server user-service:8001;
        # server user-service-2:8001;  ← 스케일 아웃 시 추가
    }

    upstream chat_service {
        server chat-service:8002;
    }

    upstream notification_service {
        server notification-service:8003;
    }

    server {
        listen 80;

        # ── 유저 서비스 ──────────────────────────────────
        location /api/users/login {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            limit_req zone=login_limit burst=3 nodelay;    # 로그인은 엄격하게
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 채팅 서비스 WebSocket ────────────────────────
        # WebSocket은 반드시 일반 HTTP 라우팅보다 먼저 선언
        location /api/chat/ws {
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;       # WebSocket 핵심
            proxy_set_header Connection "upgrade";        # WebSocket 핵심
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;                     # WebSocket 연결 유지 1시간
        }

        # ── 채팅 서비스 HTTP ─────────────────────────────
        location /api/chat {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 알림 서비스 ──────────────────────────────────
        location /api/notify {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Nginx 자체 헬스체크 ──────────────────────────
        location /health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }
    }
}