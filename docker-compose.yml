version: '3.8'

services:

  # ── 인프라 ──────────────────────────────────────────
  traefik:
    image: traefik:v2.10
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ── 서비스 ──────────────────────────────────────────
  user-service:
    build: ./services/user-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.rule=PathPrefix(`/api/users`)"
      - "traefik.http.services.user.loadbalancer.server.port=8001"
    depends_on:
      - redis
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}

  chat-service:
    build: ./services/chat-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=PathPrefix(`/api/chat`)"
      - "traefik.http.services.chat.loadbalancer.server.port=8002"
    depends_on:
      - kafka
      - redis
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=${MONGO_DB}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_URL=${KAFKA_URL}

  notification-service:
    build: ./services/notification-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notify.rule=PathPrefix(`/api/notify`)"
      - "traefik.http.services.notify.loadbalancer.server.port=8003"
    depends_on:
      - kafka
      - redis
    environment:
      - REDIS_URL=${REDIS_URL}
      - KAFKA_URL=${KAFKA_URL}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID}